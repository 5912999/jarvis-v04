<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020915"><title>JARVIS v0.7</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020915;color:#aeefff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#103451 0%,#06182b 44%,#020915 78%)}
.hud{position:relative;width:min(90vw,470px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 0 14px #008eea)}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.outer{inset:1%;border:1px solid #37d5ff88;box-shadow:0 0 17px #00baff44,inset 0 0 20px #00baff33}
.ticks{inset:2%;background:repeating-conic-gradient(from 0deg,#7eeeffaa 0deg .5deg,transparent .5deg 4deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67% 69%,transparent 70%);mask:radial-gradient(circle,transparent 66%,#000 67% 69%,transparent 70%);animation:spin 80s linear infinite}
.arc1{inset:9%;border:7px double #42d8ff;border-left-color:transparent;border-bottom-color:#42d8ff44;animation:spin 26s linear infinite}
.arc2{inset:16%;border:2px dashed #9cefffaa;animation:spin 38s linear infinite reverse}
.arc3{inset:23%;border:9px solid #26bfff;border-top-color:transparent;border-right-color:#26bfff44;transform:rotateX(24deg);animation:spin 17s linear infinite}
.arc4{inset:30%;border:2px dotted #9cffff;animation:spin 12s linear infinite reverse}
.arc5{inset:36%;border:3px solid #4ad7ff;border-left-color:transparent;border-bottom-color:transparent;animation:spin 9s linear infinite}
.orbit{inset:12%;border:1px solid #5fdfff55;transform:rotateX(64deg) rotate(-23deg);box-shadow:0 0 14px #008bff66}
.orbit.b{inset:17%;transform:rotateY(62deg) rotate(26deg)}
.core{width:24%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#d8ffff 0%,#6cf2ff 11%,#00a7eb 25%,#005493 53%,#001328 76%);box-shadow:0 0 30px #00cfff,0 0 65px #0088ff88;animation:breathe 4.8s ease-in-out infinite}
.core:after{content:"";display:block;width:100%;height:100%;border-radius:50%;border:2px dotted #d5ffffaa;animation:spin 13s linear infinite}
h1{font-size:14px;font-weight:400;letter-spacing:.32em;margin:24px 0 10px}
p{font-size:11px;letter-spacing:.12em;color:#83b7ca;margin:0}
@keyframes spin{to{rotate:360deg}}@keyframes breathe{0%,100%{scale:.94;filter:brightness(.85)}50%{scale:1.09;filter:brightness(1.4)}}
@media(prefers-reduced-motion:reduce){.ticks,.arc1,.arc2,.arc3,.arc4,.arc5,.core,.core:after{animation:none}}
</style></head><body><main class="hud" aria-label="青い多層ホログラムリング"><div class="ring outer"></div><div class="ring ticks"></div><div class="ring arc1"></div><div class="ring arc2"></div><div class="ring arc3"></div><div class="ring arc4"></div><div class="ring arc5"></div><div class="ring orbit"></div><div class="ring orbit b"></div><div class="core"></div></main><h1>J A R V I S · 0.7</h1><p>HOLOGRAPHIC INTERFACE · STANDBY</p></body></html>
