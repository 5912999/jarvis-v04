<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020915"><title>JARVIS v1.2.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020915;color:#aeefff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#103451 0%,#06182b 44%,#020915 78%)}
.hud{position:relative;width:min(90vw,470px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 0 14px #008eea)}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.outer{inset:1%;border:1px solid #37d5ff88;box-shadow:0 0 17px #00baff44,inset 0 0 20px #00baff33}
.ticks{inset:2%;background:repeating-conic-gradient(from 0deg,#7eeeffaa 0deg .5deg,transparent .5deg 4deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67% 69%,transparent 70%);mask:radial-gradient(circle,transparent 66%,#000 67% 69%,transparent 70%);animation:spin 41.03s linear infinite}
.arc1{inset:9%;border:7px double #42d8ff;border-left-color:transparent;border-bottom-color:#42d8ff44;animation:spin 13.33s linear infinite}
.arc2{inset:16%;border:2px dashed #9cefffaa;animation:spin 19.49s linear infinite reverse}
.arc3{inset:23%;border:9px solid #26bfff;border-top-color:transparent;border-right-color:#26bfff44;transform:rotateX(24deg);animation:spin 8.72s linear infinite}
.arc4{inset:30%;border:2px dotted #9cffff;animation:spin 6.15s linear infinite reverse}
.arc5{inset:36%;border:3px solid #4ad7ff;border-left-color:transparent;border-bottom-color:transparent;animation:spin 4.61s linear infinite}
.arc6{inset:5%;border:1px dashed #76eaff99;border-right-color:transparent;animation:spin 21.33s linear infinite reverse}
.arc7{inset:27%;border:2px solid #8cefff99;border-top-color:transparent;border-bottom-color:transparent;animation:spin 9.33s linear infinite}
.arc8{inset:41%;border:1px dotted #b7ffffcc;animation:spin 5.00s linear infinite reverse}

.arc9{inset:3.5%;border:1px dotted #78eaff77;border-left-color:transparent;animation:spin 30s linear infinite}
.arc10{inset:13.5%;border:3px solid #56dfff99;border-top-color:transparent;border-bottom-color:transparent;animation:spin 18s linear infinite reverse}
.arc11{inset:20%;border:1px dashed #c1ffff99;animation:spin 11s linear infinite}
.arc12{inset:33%;border:3px double #5cdfffaa;border-left-color:transparent;animation:spin 7s linear infinite reverse}
.arc13{inset:44%;border:1px solid #b9ffff99;border-right-color:transparent;animation:spin 5s linear infinite}
.marks{inset:6%;background:repeating-conic-gradient(#8defffbb 0deg .25deg,transparent .25deg 2deg);-webkit-mask:radial-gradient(circle,transparent 80%,#000 81% 82%,transparent 83%);mask:radial-gradient(circle,transparent 80%,#000 81% 82%,transparent 83%);animation:spin 44s linear infinite reverse}
.scanner{inset:18%;background:conic-gradient(from 30deg,transparent 0deg 260deg,#00baff00 290deg,#55faff77 307deg,transparent 317deg);border-radius:50%;animation:spin 15s linear infinite;opacity:.55;pointer-events:none}
.orbit{inset:12%;border:1px solid #5fdfff55;transform:rotateX(64deg) rotate(-23deg);box-shadow:0 0 14px #008bff66}
.orbit.b{inset:17%;transform:rotateY(62deg) rotate(26deg)}
.core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#d8ffff 0%,#6cf2ff 11%,#00a7eb 25%,#005493 53%,#001328 76%);box-shadow:0 0 30px #00cfff,0 0 65px #0088ff88;animation:breathe 4.8s ease-in-out infinite}
.core:after{content:"";display:block;width:100%;height:100%;border-radius:50%;border:2px dotted #d5ffffaa;animation:spin 6.67s linear infinite}
h1{font-size:14px;font-weight:400;letter-spacing:.32em;margin:24px 0 10px}
p{font-size:11px;letter-spacing:.12em;color:#83b7ca;margin:0}
@keyframes spin{to{rotate:360deg}}@keyframes breathe{0%,100%{scale:.94;filter:brightness(.85)}50%{scale:1.09;filter:brightness(1.4)}}
@media(prefers-reduced-motion:reduce){.ticks,.arc1,.arc2,.arc3,.arc4,.arc5,.arc6,.arc7,.arc8,.arc9,.arc10,.arc11,.arc12,.arc13,.marks,.scanner,.core,.core:after{animation:none}}

.hud .microdata{position:absolute;inset:0;pointer-events:none;color:#9befff;opacity:.7;font:clamp(7px,1.7vw,10px)/1.3 monospace;letter-spacing:.13em}
.microdata span{position:absolute;text-shadow:0 0 7px #00d9ff}
.microdata .tl{top:17%;left:9%}.microdata .tr{top:23%;right:8%;text-align:right}
.microdata .bl{bottom:21%;left:7%}.microdata .br{bottom:17%;right:8%;text-align:right}
.hud .crosshair{position:absolute;inset:47%;border:1px solid #9cffff66;border-radius:50%;pointer-events:none;box-shadow:0 0 14px #00bfff77}
.hud .crosshair:before,.hud .crosshair:after{content:"";position:absolute;background:#83faff99}
.hud .crosshair:before{width:160%;height:1px;left:-30%;top:50%}
.hud .crosshair:after{height:160%;width:1px;top:-30%;left:50%}
@media(prefers-reduced-motion:reduce){.scanner{animation:none}}

.hud{touch-action:manipulation}
.hud .tapwave{position:absolute;inset:34%;border:1px solid #a5faff;border-radius:50%;opacity:0;pointer-events:none}
.hud.engaged .tapwave{animation:tapwave 1.1s ease-out}
@keyframes tapwave{0%{opacity:.95;transform:scale(.45);box-shadow:0 0 15px #6dfcff}100%{opacity:0;transform:scale(3.4);box-shadow:0 0 3px #6dfcff}}
.hud.engaged .core{filter:brightness(1.6)}
.microdata .tl,.microdata .br{animation:dataglow 4s ease-in-out infinite}
.microdata .tr,.microdata .bl{animation:dataglow 5.2s ease-in-out infinite reverse}
@keyframes dataglow{50%{opacity:.42}}
@media(prefers-reduced-motion:reduce){.microdata span{animation:none!important}.hud.engaged .tapwave{animation:none}}

/* Strong centered touch feedback, drawn above the rotating layers. */
.hud .tapwave{position:absolute;top:50%;left:50%;inset:auto;width:20%;aspect-ratio:1;border:3px solid #d6ffff;border-radius:50%;opacity:0;z-index:80;pointer-events:none;box-shadow:0 0 20px #00eaff, inset 0 0 10px #00eaff;transform:translate(-50%,-50%) scale(.4)}
.hud.engaged .tapwave{animation:jarvisWave 1.2s ease-out both}
.hud.engaged .tapwave.wave2{animation-delay:.17s}
@keyframes jarvisWave{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}65%{opacity:.8}100%{opacity:0;transform:translate(-50%,-50%) scale(4.4)}}
.hud.engaged .core{filter:brightness(1.9) !important}
@media(prefers-reduced-motion:reduce){.hud.engaged .tapwave{animation:jarvisWave 1.2s ease-out both}}

/* Fix: center ripple over the orb, not the HUD's upper-left corner. */
.hud .tapwave,.hud .tapwave.wave2{
  position:absolute;inset:auto;top:50%;left:50%;right:auto;bottom:auto;
  width:24%;height:24%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.5);
  border:2px solid #b8faff;border-radius:50%;opacity:0;
  pointer-events:none;z-index:80;box-shadow:0 0 20px #00eaff,inset 0 0 10px #00eaff;
}
.hud.engaged .tapwave{animation:jarvisWave 1.2s ease-out both}
.hud.engaged .tapwave.wave2{animation:jarvisWave 1.2s ease-out .17s both}
</style></head><body><main class="hud" aria-label="青い多層ホログラムリング"><div class="ring outer"></div><div class="ring ticks"></div><div class="ring arc1"></div><div class="ring arc2"></div><div class="ring arc3"></div><div class="ring arc4"></div><div class="ring arc5"></div><div class="ring arc6"></div><div class="ring arc7"></div><div class="ring arc8"></div><div class="ring arc9"></div><div class="ring arc10"></div><div class="ring arc11"></div><div class="ring arc12"></div><div class="ring arc13"></div><div class="ring marks"></div><div class="scanner"></div><div class="ring orbit"></div><div class="ring orbit b"></div><div class="core"></div><div class="tapwave"></div><div class="tapwave wave2"></div><div class="microdata" aria-hidden="true"><span class="tl">SYS / ONLINE<br>ARC 01—13</span><span class="tr">HOLOGRAPHIC<br>DISPLAY 1.2.1</span><span class="bl">SCAN ACTIVE<br>LOCAL MODE</span><span class="br">CORE STABLE<br>13 CHANNELS</span></div></main><h1>J A R V I S · 1.2.1</h1><p>HOLOGRAPHIC INTERFACE · STANDBY</p><script>
const hud=document.querySelector('.hud');
let tapTimer;
hud.addEventListener('click',()=>{
  hud.classList.remove('engaged');
  void hud.offsetWidth;
  hud.classList.add('engaged');
  clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>hud.classList.remove('engaged'),1150);
});
</script></body></html>
